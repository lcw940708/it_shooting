name: Auto Update IT Troubleshooting Data

on:
  schedule:
    - cron: '0 */2 * * *' # 每隔 2 小時執行一次
  workflow_dispatch: # 允許手動觸發

jobs:
  update-data:
  
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # 賦予自動提交並推送到倉庫的權限

    steps:
      - name: 檢出倉庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 執行主腳本更新數據
        run: python main.py

      - name: 自動提交並推送更新後的數據
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/troubleshooting.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "chore: auto-update IT troubleshooting data [skip ci]" && git push)
